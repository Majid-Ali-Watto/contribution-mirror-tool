<text x="840" y="270" text-anchor="middle" font-size="12" font-weight="600" fill="#3fb950">work + personal</text>
<text x="480" y="316" text-anchor="middle" font-size="13" fill="#f85149">Never copied: code · file names · commit messages · hashes · repo names · PR titles</text>
