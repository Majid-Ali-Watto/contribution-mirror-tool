<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" width="960" height="390" role="img" aria-labelledby="t d" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif">
<title id="t">contribution-mirror-tool overview</title>
<desc id="d">Work repos on any git host are read for commit, pull request and review dates only. The tool writes empty commits with those dates to a personal repo, which fills your personal contribution graph.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#58a6ff"/></marker></defs>
<rect width="960" height="390" rx="16" fill="#0d1117"/>
<text x="40" y="52" font-size="28" font-weight="800" fill="#f0f6fc">contribution-mirror-tool</text>
<text x="40" y="82" font-size="15" fill="#8b949e">Your work shows up on your personal GitHub graph. Only the dates travel.</text>
<rect x="30" y="120" width="205" height="160" rx="12" fill="#161b22" stroke="#30363d"/><text x="132.5" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Work repos</text><text x="132.5" y="182" text-anchor="middle" font-size="12.5" fill="#c9d1d9">GitHub · GitLab</text><text x="132.5" y="204" text-anchor="middle" font-size="12.5" fill="#c9d1d9">Bitbucket · Azure DevOps</text><text x="132.5" y="226" text-anchor="middle" font-size="12.5" fill="#c9d1d9">Gitea · any git host</text><text x="132.5" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#f0883e">code stays here</text>
<line x1="237" y1="200" x2="273" y2="200" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/><text x="255.0" y="188" text-anchor="middle" font-size="10.5" fill="#8b949e">read</text>
<rect x="275" y="120" width="205" height="160" rx="12" fill="#161b22" stroke="#30363d"/><text x="377.5" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Mirror tool</text><text x="377.5" y="182" text-anchor="middle" font-size="12.5" fill="#c9d1d9">reads dates only</text><text x="377.5" y="204" text-anchor="middle" font-size="12.5" fill="#c9d1d9">commits · PRs · reviews</text><text x="377.5" y="226" text-anchor="middle" font-size="12.5" fill="#c9d1d9">runs on your machine</text><text x="377.5" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#3fb950">no telemetry</text>
<line x1="482" y1="200" x2="518" y2="200" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/><text x="500.0" y="188" text-anchor="middle" font-size="10.5" fill="#8b949e">write</text>
<rect x="520" y="120" width="190" height="160" rx="12" fill="#161b22" stroke="#30363d"/><text x="615.0" y="150" text-anchor="middle" font-size="16" font-weight="700" fill="#f0f6fc">Personal repo</text><text x="615.0" y="182" text-anchor="middle" font-size="12.5" fill="#c9d1d9">empty commits</text><text x="615.0" y="204" text-anchor="middle" font-size="12.5" fill="#c9d1d9">message: mirror</text><text x="615.0" y="226" text-anchor="middle" font-size="12.5" fill="#c9d1d9">original dates</text><text x="615.0" y="262" text-anchor="middle" font-size="12" font-weight="600" fill="#3fb950">you own it</text>
<line x1="712" y1="200" x2="748" y2="200" stroke="#58a6ff" stroke-width="2" marker-end="url(#a)"/><text x="730.0" y="188" text-anchor="middle" font-size="10.5" fill="#8b949e">count</text>
<rect x="750" y="120" width="180" height="160" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="840" y="150" text-anchor="middle" font-size="15" font-weight="700" fill="#f0f6fc">Contribution graph</text>
